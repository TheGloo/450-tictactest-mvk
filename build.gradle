plugins {
	id 'java'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform('org.junit:junit-bom:5.14.0')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.assertj:assertj-core:3.27.6'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
	manifest {
		attributes 'Main-Class': 'ch.bbw.m450.tictactoe.TicTacToeMain'
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
	// every test run also produces the coverage report
	finalizedBy jacocoTestReport
}

jacoco {
	// 0.8.14+ is required to instrument Java 25 class files
	toolVersion = '0.8.15'
}

// Coverage report in build/reports/jacoco/test/:
//   html/                     - human readable, uploaded as CI artifact
//   jacocoTestReport.csv      - read by .github/scripts/coverage.sh (time series, PR gate)
//   jacocoTestReport.xml      - for tools that expect the JaCoCo XML format
jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
		csv.required = true
	}
}

// Mutation testing with PIT (https://pitest.org): ./gradlew pitest
// PIT changes the compiled code in small ways (mutants, e.g. `==` -> `!=`) and runs
// the tests against each one. A mutant the tests do not notice "survives" and points
// to a gap in the assertions that line coverage cannot show.
// Report in build/reports/pitest/: index.html (human readable), mutations.xml
pitest {
	pitestVersion = '1.30.0'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['ch.bbw.m450.tictactoe.*']
	targetTests = ['ch.bbw.m450.tictactoe.*']
	// main() and HumanPlayer read from System.in - not meaningful to mutate
	excludedMethods = ['main']
	excludedClasses = ['ch.bbw.m450.tictactoe.players.HumanPlayer']
	mutators = ['STRONGER']
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
	exportLineCoverage = true
	threads = Runtime.runtime.availableProcessors()
	// the build fails if fewer than 90 % of the mutants are killed (currently 100 %)
	mutationThreshold = 90
}
