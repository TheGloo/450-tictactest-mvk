plugins {
	id 'java'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.assertj:assertj-core:3.27.7'
	// @StdIo: feeds System.in and captures System.out for HumanPlayer and main()
	testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'
	// property-based testing (second test framework, own JUnit Platform engine)
	testImplementation 'net.jqwik:jqwik:1.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
	manifest {
		attributes 'Main-Class': 'ch.bbw.m450.tictactoe.TicTacToeMain'
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
	// every test run also produces the coverage report
	finalizedBy jacocoTestReport
}

jacoco {
	// 0.8.14+ is required to instrument Java 25 class files
	toolVersion = '0.8.15'
}

// Coverage report in build/reports/jacoco/test/:
//   html/                     - human readable, uploaded as CI artifact
//   jacocoTestReport.csv      - read by .github/scripts/coverage.sh (time series, PR gate)
//   jacocoTestReport.xml      - for tools that expect the JaCoCo XML format
jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
		csv.required = true
	}
}

// Coverage gate: `./gradlew check` (and therefore `build`) fails when less than 90 %
// of all branches are covered by the tests.
jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
		}
	}
}
check.dependsOn jacocoTestCoverageVerification

// Mutation testing with PIT (https://pitest.org): ./gradlew pitest
// PIT changes the compiled code in small ways (mutants, e.g. `==` -> `!=`) and runs
// the tests against each one. A mutant the tests do not notice "survives" and points
// to a gap in the assertions that line coverage cannot show.
// Report in build/reports/pitest/: index.html (human readable), mutations.xml
pitest {
	pitestVersion = '1.30.0'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['ch.bbw.m450.tictactoe.*']
	targetTests = ['ch.bbw.m450.tictactoe.*']
	// the jqwik properties use random inputs; the mutants are killed by the
	// deterministic JUnit tests, so PIT stays reproducible and fast
	excludedTestClasses = ['*Properties']
	mutators = ['STRONGER']
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
	exportLineCoverage = true
	threads = Runtime.runtime.availableProcessors()
	// the build fails if fewer than 90 % of the mutants are killed
	// (currently 96 %, the survivors are equivalent mutants, see docs/MUTATIONTESTING.md)
	mutationThreshold = 90
}
