# Local copy of the nginx configuration on EC2 (infra/cloud-init.yaml.tftpl), only the
# address of ttyd differs (container instead of 127.0.0.1).
server {
    listen 80;

    # version of the running jar, read by the frontend on another origin
    location = /version {
        alias /opt/tictactest/current/version.txt;
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://webconsole:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
