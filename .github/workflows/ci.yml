name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # Run every step inside our own image from the GitHub Container Registry.
    # It already provides Zulu 25 (the pinned daemon JVM) and the Gradle
    # distribution, so there is no "Set up JDK" step anymore.
    container:
      image: ghcr.io/thegloo/450-tictactest-mvk:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew build --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tictactoe-jar
          path: build/libs/*.jar
          if-no-files-found: error
