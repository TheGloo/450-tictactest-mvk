name: Publish image

# Baut das CI/CD-Image aus dem Dockerfile und lädt es als
# ghcr.io/thegloo/450-tictactest-mvk:latest in die GitHub Container Registry.
# Manuell auslösbar (Actions -> Publish image -> Run workflow) und automatisch,
# sobald sich das Dockerfile oder der Gradle-Wrapper ändert.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - gradle/wrapper/**
      - gradlew
      - .github/workflows/publish-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Needed for the type=gha build cache: the default "docker" driver cannot
      # export a cache, the docker-container driver from buildx can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/thegloo/450-tictactest-mvk:latest
            ghcr.io/thegloo/450-tictactest-mvk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
