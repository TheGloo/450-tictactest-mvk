name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  image:
    name: DevContainer image
    uses: ./.github/workflows/devcontainer-ref.yml

  release:
    name: Build & Publish Release
    needs: image
    runs-on: ubuntu-latest

    # Same image as the CI job: the DevContainer version pinned in devcontainer.json.
    container:
      image: ${{ needs.image.outputs.image }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build runnable jar
        run: ./gradlew build -Pversion="$VERSION" --stacktrace

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the workspace belongs to the runner's UID, not to root in the container
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" \
            build/libs/*.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
