name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  image:
    name: DevContainer image
    uses: ./.github/workflows/devcontainer-ref.yml

  release:
    name: Build & Publish Release
    needs: image
    runs-on: ubuntu-latest

    # Same image as the CI job: the DevContainer version pinned in devcontainer.json.
    container:
      image: ${{ needs.image.outputs.image }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build runnable jar
        run: ./gradlew build -Pversion="$VERSION" --stacktrace

      # Frontend archive: the files of frontend/ plus the version from the tag. config.js
      # stays out, every environment has its own (on S3 written by OpenTofu).
      - name: Build frontend archive
        run: |
          mkdir -p build/frontend
          cp frontend/* build/frontend/
          rm build/frontend/config.js
          printf '{ "version": "%s" }\n' "$VERSION" > build/frontend/version.json
          # `jar` writes a plain zip and is part of the JDK in the image
          jar --create --no-manifest --file "build/tictactest-frontend-$VERSION.zip" -C build/frontend .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the workspace belongs to the runner's UID, not to root in the container
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The GitHub API answers 5xx now and then: up to three attempts. A failed attempt
          # can leave a draft behind (create = draft, upload, publish): remove it first.
          for attempt in 1 2 3; do
            while [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null)" = true ]; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$(gh release view "$GITHUB_REF_NAME" --json databaseId -q .databaseId)"
            done
            gh release create "$GITHUB_REF_NAME" \
              build/libs/*.jar \
              "build/tictactest-frontend-$VERSION.zip" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done

  # What changed since the previous release tag? Not the last commit: a release can
  # contain many commits, and a commit on main without a tag is never deployed.
  changes:
    name: Changes since previous release
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all commits and tags, otherwise there is nothing to compare

      - name: Compare with previous release tag
        id: diff
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [[ -z "$previous" ]]; then
            echo "first release: deploy everything"
            backend=true frontend=true
          else
            files=$(git diff --name-only "$previous" "$GITHUB_REF_NAME")
            echo "changed since $previous:"; echo "$files"
            # backend = everything that ends up in the jar
            backend=$(grep -qE '^(src/main/|gradle/|build\.gradle$|settings\.gradle$|gradle\.properties$)' <<< "$files" && echo true || echo false)
            # frontend = frontend/ without the local config.js
            frontend=$(grep '^frontend/' <<< "$files" | grep -qv '^frontend/config\.js$' && echo true || echo false)
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          {
            echo "| Vergleich | Backend | Frontend |"
            echo "|---|---|---|"
            echo "| ${previous:-erster Release} → $GITHUB_REF_NAME | $backend | $frontend |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: [release, changes]
    # without the GitHub Variables of the infrastructure (deploy/github-vars.sh) there is
    # no target yet: the release is published, the deployment is done by hand
    if: >-
      vars.INSTANCE_ID != '' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
    secrets: inherit
