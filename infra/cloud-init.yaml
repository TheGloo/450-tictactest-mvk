#cloud-config
# Runs once when the instance is created: Docker and an empty deployment directory.
package_update: true
packages:
  - docker.io
  - docker-compose-v2

runcmd:
  - systemctl enable --now docker
  # the deployment logs in as ubuntu and runs docker compose without sudo
  - usermod -aG docker ubuntu
  - install -d -o ubuntu -g ubuntu /opt/tictactest /opt/tictactest/app
