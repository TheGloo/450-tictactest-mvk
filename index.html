<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicTacTest Coverage</title>
<meta name="description" content="Entwicklung der Test Coverage (JaCoCo) des main-Branches von TicTacTest">
<!-- Generated by .github/actions/coverage-timeseries - edit the template there, not on gh-pages. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
	:root {
		--surface-0: #f4f4f2;
		--surface-1: #fcfcfb;
		--border: #e2e1dc;
		--grid: #ecebe7;
		--text-primary: #0b0b0b;
		--text-secondary: #52514e;
		--series-1: #2a78d6;
		--good: #0a7d0a;
		--critical: #c23030;
		color-scheme: light;
	}
	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]) {
			--surface-0: #111110;
			--surface-1: #1a1a19;
			--border: #33332f;
			--grid: #2a2a27;
			--text-primary: #ffffff;
			--text-secondary: #c3c2b7;
			--series-1: #3987e5;
			--good: #3cc03c;
			--critical: #e66767;
			color-scheme: dark;
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: var(--surface-0);
		color: var(--text-primary);
		font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
	h1 { font-size: 1.6rem; margin: 0 0 4px; }
	h2 { font-size: 1.1rem; margin: 0 0 12px; }
	p.lead { margin: 0 0 24px; color: var(--text-secondary); }
	a { color: var(--series-1); }
	.card {
		background: var(--surface-1);
		border: 1px solid var(--border);
		border-radius: 12px;
		padding: 20px;
		margin-bottom: 20px;
	}
	.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
	.stat .label { color: var(--text-secondary); font-size: .85rem; }
	.stat .value { font-size: 2.2rem; font-weight: 650; font-variant-numeric: tabular-nums; }
	.stat .sub { color: var(--text-secondary); font-size: .9rem; font-variant-numeric: tabular-nums; }
	.up { color: var(--good); }
	.down { color: var(--critical); }
	.chart-box { position: relative; height: 320px; }
	table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
	th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
	th { color: var(--text-secondary); font-weight: 600; font-size: .85rem; }
	td.num, th.num { text-align: right; }
	code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .9em; }
	.table-wrap { overflow-x: auto; }
	#error { display: none; color: var(--critical); }
</style>
</head>
<body>
<main>
	<h1>TicTacTest – Test Coverage</h1>
	<p class="lead">Line Coverage (JaCoCo) des <code>main</code>-Branches, ein Messpunkt pro Push auf <code>main</code>.</p>

	<p id="error" class="card"></p>

	<section class="card stats" aria-label="Aktueller Stand">
		<div class="stat">
			<div class="label">Aktuelle Coverage</div>
			<div class="value" id="current">–</div>
			<div class="sub" id="current-commit"></div>
		</div>
		<div class="stat">
			<div class="label">Veränderung zum vorherigen Commit</div>
			<div class="value" id="delta">–</div>
			<div class="sub" id="delta-note"></div>
		</div>
		<div class="stat">
			<div class="label">Messungen</div>
			<div class="value" id="count">–</div>
			<div class="sub"><a href="report/index.html">Aktueller JaCoCo-Report</a> · <a href="coverage-history.csv">CSV</a></div>
		</div>
	</section>

	<section class="card">
		<h2>Verlauf</h2>
		<div class="chart-box"><canvas id="chart" role="img" aria-label="Liniendiagramm der Line Coverage über die Zeit"></canvas></div>
	</section>

	<section class="card">
		<h2>Alle Messungen</h2>
		<div class="table-wrap">
			<table>
				<thead><tr><th>Datum (UTC)</th><th>Commit</th><th class="num">Coverage</th><th class="num">Δ</th></tr></thead>
				<tbody id="rows"></tbody>
			</table>
		</div>
	</section>
</main>

<script>
(async () => {
	// https://<owner>.github.io/<repo>/ -> https://github.com/<owner>/<repo>
	const owner = location.hostname.split(".")[0];
	const repo = location.pathname.split("/").filter(Boolean)[0] || "";
	const repoUrl = `https://github.com/${owner}/${repo}`;
	const commitLink = sha => `<a href="${repoUrl}/commit/${sha}"><code>${sha.slice(0, 7)}</code></a>`;
	const fmtPct = v => v.toFixed(2) + " %";
	const fmtDelta = d => (d > 0 ? "▲ +" : d < 0 ? "▼ " : "● ±") + d.toFixed(2) + " pp";
	const fmtDate = iso => new Date(iso).toLocaleString("de-CH", { timeZone: "UTC", dateStyle: "short", timeStyle: "short" });

	let rows;
	try {
		const res = await fetch("coverage-history.csv", { cache: "no-store" });
		if (!res.ok) throw new Error(`HTTP ${res.status}`);
		rows = (await res.text()).trim().split(/\r?\n/).slice(1)
			.map(line => line.split(","))
			.filter(cols => cols.length >= 3)
			.map(([date, commit, coverage]) => ({ date, commit, coverage: parseFloat(coverage) }));
	} catch (e) {
		const el = document.getElementById("error");
		el.textContent = "Die Coverage-Historie konnte nicht geladen werden: " + e.message;
		el.style.display = "block";
		return;
	}
	if (!rows.length) return;

	const last = rows[rows.length - 1];
	const prev = rows.length > 1 ? rows[rows.length - 2] : null;
	document.getElementById("current").textContent = fmtPct(last.coverage);
	document.getElementById("current-commit").innerHTML = `${commitLink(last.commit)} · ${fmtDate(last.date)}`;
	document.getElementById("count").textContent = rows.length;
	if (prev) {
		const d = last.coverage - prev.coverage;
		const el = document.getElementById("delta");
		el.textContent = fmtDelta(d);
		el.className = "value " + (d > 0 ? "up" : d < 0 ? "down" : "");
		document.getElementById("delta-note").innerHTML = `gegenüber ${commitLink(prev.commit)}`;
	} else {
		document.getElementById("delta-note").textContent = "erste Messung";
	}

	document.getElementById("rows").innerHTML = rows.map((r, i) => {
		const d = i > 0 ? r.coverage - rows[i - 1].coverage : null;
		const cls = d > 0 ? "up" : d < 0 ? "down" : "";
		return `<tr><td>${fmtDate(r.date)}</td><td>${commitLink(r.commit)}</td>` +
			`<td class="num">${fmtPct(r.coverage)}</td><td class="num ${cls}">${d === null ? "–" : fmtDelta(d)}</td></tr>`;
	}).reverse().join("");

	const css = getComputedStyle(document.documentElement);
	const token = name => css.getPropertyValue(name).trim();
	const values = rows.map(r => r.coverage);
	new Chart(document.getElementById("chart"), {
		type: "line",
		data: {
			labels: rows.map(r => fmtDate(r.date)),
			datasets: [{
				label: "Line Coverage",
				data: values,
				borderColor: token("--series-1"),
				backgroundColor: token("--series-1"),
				borderWidth: 2,
				pointRadius: 4,
				pointHoverRadius: 6,
				pointBorderColor: token("--surface-1"),
				pointBorderWidth: 2,
				tension: 0,
			}],
		},
		options: {
			maintainAspectRatio: false,
			interaction: { mode: "index", intersect: false },
			plugins: {
				legend: { display: false },
				tooltip: {
					callbacks: {
						title: items => rows[items[0].dataIndex].date.replace("T", " ").replace("Z", " UTC"),
						label: item => `Coverage: ${fmtPct(item.parsed.y)}`,
						afterLabel: item => `Commit: ${rows[item.dataIndex].commit.slice(0, 7)}`,
					},
				},
			},
			scales: {
				x: { grid: { display: false }, ticks: { color: token("--text-secondary"), maxRotation: 0, autoSkip: true } },
				y: {
					suggestedMin: Math.max(0, Math.floor(Math.min(...values) / 10) * 10 - 10),
					max: 100,
					grid: { color: token("--grid") },
					border: { display: false },
					ticks: { color: token("--text-secondary"), callback: v => v + " %" },
				},
			},
		},
	});
})();
</script>
</body>
</html>
